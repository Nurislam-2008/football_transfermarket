databases:
  - name: football-market-db
    plan: free
    databaseName: football_market
    user: football_user

services:
  - type: web
    plan: free
    name: football-market
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'gunicorn myproject.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: football-market-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DEBUG
        value: 'False'